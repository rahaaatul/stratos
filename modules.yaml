# modules.yaml — Master configuration for Stratos module fetcher
# Each module defines: metadata keys (written to track.yaml) + source blocks (fetch config)
#
# Metadata keys per module:
#   id        — must match module.prop id= field exactly
#   enabled   — master switch, false = skip entirely
#   verified  — shown in MMRL as verified badge
#   categories— shown in MMRL for filtering
#   license   — optional, defaults to upstream repo license
#   icon      — optional, defaults to upstream owner avatar
#   owner     — upstream GitHub owner (for fetching + readme derivation)
#   repo      — upstream GitHub repo (for fetching + readme derivation)
#
# Source blocks (release/prerelease/actions/static):
#   enabled   — true/false toggle
#   keep      — absolute retention cap for this source
#   preserve  — (release only) guarantees >= 1 stable always retained
#   pattern   — regex or glob. Empty = first .zip wins.
#
# Priority for dedup: Release(0) > Pre-release(1) > Action(2)

modules:
  - id: AZenith
    enabled: true
    verified: true
    categories: ["Performance","System"]
    owner: Liliya2727
    repo: AZenith
    release:
      enabled: true
      keep: 1
      preserve: true
      pattern: "*.zip"
    prerelease:
      enabled: true
      keep: 0
    actions:
      enabled: false
      keep: 0

